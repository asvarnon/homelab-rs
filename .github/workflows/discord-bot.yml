name: Build and publish homelab-discord

on:
  push:
    branches: [main]
    paths:
      - "crates/homelab-discord/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/homelab-discord/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/homelab-discord:latest
            ghcr.io/${{ env.OWNER }}/homelab-discord:${{ github.sha }}
